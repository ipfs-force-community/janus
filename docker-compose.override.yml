# ========================================================# Docker Compose 开发调试覆盖配置 (Docker Compose Override)# 这个文件在本地运行 `docker compose up` 时会自动生效。# 它扩展了基础的 docker-compose.yml，专门用于开发调试。# 生产环境部署时不应包含此文件。# ========================================================
services:
  # 开发时：前端端口只对主机开放
  frontend:
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3001}:3001"

  # 开发时：API 端口只对主机开放
  api:
    ports:
      - "127.0.0.1:${API_PORT:-10086}:10086"

  # 开发时：MySQL 端口只对主机开放
  mysql:
    ports:
      - "127.0.0.1:${MYSQL_EXTERNAL_PORT:-3306}:3306"
